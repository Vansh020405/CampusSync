<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#emeraldGradient)" />

  <!-- Graduation Cap -->
  <g transform="translate(256 220) scale(0.85)">
    <!-- Cap Board -->
    <path d="M0-110 L-180 0 L0 110 L180 0 Z" fill="#ffffff" filter="url(#shadow)"/>
    <!-- Cap Bottom -->
    <path d="M-180 0 L0 110 L180 0 V60 L0 170 L-180 60 Z" fill="#ecfdf5" fill-opacity="0.3"/> 
    <!-- Tassel -->
    <circle cx="0" cy="0" r="15" fill="#facc15" />
    <path d="M0 0 Q 80 80 140 120 L 120 160" stroke="#facc15" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Connection Lines (Academic Sync) -->
  <path d="M128 350 A 100 100 0 0 0 384 350" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-dasharray="20 40" opacity="0.6" />
</svg>
